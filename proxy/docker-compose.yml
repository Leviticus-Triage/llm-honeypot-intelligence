# Ollama Proxy Stack - Caching proxy with RL for LLM honeypots
#
# Prerequisites:
#   - Ollama running on the host (port 11434)
#   - T-Pot VM with Elasticsearch accessible
#   - Copy .env.example to .env and fill in credentials
#
# Usage:
#   docker compose up -d

services:
  ollama-proxy:
    container_name: ollama-proxy
    build: .
    restart: always
    network_mode: host
    environment:
      - CONFIG_PATH=/app/config.yaml
      - CACHE_DB=/data/ollama-proxy/cache.db
      - ES_URL=${ES_URL}
    volumes:
      - proxy_data:/data/ollama-proxy
      - rules_output:/data/ollama-proxy/generated-rules:ro
      - threat_output:/data/ollama-proxy/threat-intel:ro
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:11435/proxy/health'); exit(0 if r.status_code==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  rl-scorer:
    container_name: ollama-rl-scorer
    build: .
    restart: always
    network_mode: host
    environment:
      - CACHE_DB=/data/ollama-proxy/cache.db
      - ES_URL=${ES_URL}
      - ES_USER=${ES_USER}
      - ES_PASS=${ES_PASS}
      - ES_INSECURE=${ES_INSECURE:-1}
      - TPOT_VM_IP=${TPOT_VM_IP}
      - SCORER_INTERVAL=300
    volumes:
      - proxy_data:/data/ollama-proxy
      - ./run_scorer.py:/app/run_scorer.py:ro
    entrypoint: ["python", "/app/run_scorer.py"]

  reward-aggregator:
    container_name: ollama-reward-aggregator
    build: .
    restart: always
    network_mode: host
    environment:
      - CACHE_DB=/data/ollama-proxy/cache.db
      - ES_URL=${ES_URL}
      - ES_USER=${ES_USER}
      - ES_PASS=${ES_PASS}
      - ES_INSECURE=${ES_INSECURE:-1}
      - REWARD_INTERVAL=900
      - REWARD_WINDOW_MINUTES=30
      - REWARD_BACKFILL_HOUR_UTC=2
      - VALIDATED_RULES_DIR=/data/ollama-proxy/validated-rules/approved
      - RULES_DIR=/data/ollama-proxy/generated-rules
      - REWARD_STATE_PATH=/data/ollama-proxy/reward_aggregator_state.json
      # Adversarial-Judge (Roadmap 3.3): grades honeypot response realism.
      # Lives out-of-band inside the reward-aggregator; can be disabled by
      # setting JUDGE_ENABLED=false without code changes.
      - PROXY_URL=${PROXY_URL:-http://localhost:11435}
      - JUDGE_ENABLED=${JUDGE_ENABLED:-true}
      - JUDGE_BATCH_LIMIT=${JUDGE_BATCH_LIMIT:-40}
      - JUDGE_TIMEOUT=${JUDGE_TIMEOUT:-90}
      # Plausibility analyzer (Roadmap 3.3 follow-up): fires once per day
      # at the configured UTC hour. The readiness gate inside the module
      # keeps the output directory empty until enough data has accrued.
      - PLAUSIBILITY_ANALYSIS_HOUR_UTC=${PLAUSIBILITY_ANALYSIS_HOUR_UTC:-3}
      - PLAUSIBILITY_MIN_JUDGEMENTS=${PLAUSIBILITY_MIN_JUDGEMENTS:-300}
      - PLAUSIBILITY_MIN_DAYS=${PLAUSIBILITY_MIN_DAYS:-3}
      - PLAUSIBILITY_MIN_STDDEV=${PLAUSIBILITY_MIN_STDDEV:-0.10}
      - PLAUSIBILITY_TRIAGE_TOP_N=${PLAUSIBILITY_TRIAGE_TOP_N:-20}
      - PLAUSIBILITY_REPORT_DIR=/data/ollama-proxy/reports
      - PLAUSIBILITY_ANALYSIS_ONESHOT=${PLAUSIBILITY_ANALYSIS_ONESHOT:-false}
    volumes:
      - proxy_data:/data/ollama-proxy
      - ./run_reward_aggregator.py:/app/run_reward_aggregator.py:ro
      - ./src/plausibility_analyzer.py:/app/src/plausibility_analyzer.py:ro
      - rules_output:/data/ollama-proxy/generated-rules:ro
      - rules_validated:/data/ollama-proxy/validated-rules:ro
    entrypoint: ["python", "/app/run_reward_aggregator.py"]

  ml-runner:
    container_name: ollama-ml-runner
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      - ES_URL=${ES_URL}
      - ES_USER=${ES_USER}
      - ES_PASS=${ES_PASS}
      - ES_INSECURE=${ES_INSECURE:-1}
      - DATASET_DIR=/data/ml-runner/datasets
      - MODEL_DIR=/data/ml-runner/models
      - ML_SOURCE_INDEX=honeypot-cve-sessions
      - ML_EXPORT_HOURS=720
      - ML_INFER_HOURS=24
      - ML_MAX_EXPORT_DOCS=50000
      - ML_MAX_INFER_DOCS=5000
      # Periodic training/inference so the c2-detector fusion layer
      # (C2_ML_SESSION_WINDOW_HOURS=48) always sees fresh scores.
      - ML_RUNNER_LOOP_INTERVAL=${ML_RUNNER_LOOP_INTERVAL:-6h}
      - ML_RUNNER_STARTUP_DELAY=${ML_RUNNER_STARTUP_DELAY:-60s}
    volumes:
      - ml_models:/data/ml-runner/models
      - ml_datasets:/data/ml-runner/datasets
      - ./run_ml_runner.py:/app/run_ml_runner.py:ro
    entrypoint: ["python", "/app/run_ml_runner.py", "loop"]

  rule-generator:
    container_name: ollama-rule-generator
    build: .
    restart: always
    network_mode: host
    environment:
      - CACHE_DB=/data/ollama-proxy/cache.db
      - ES_URL=${ES_URL}
      - ES_USER=${ES_USER}
      - ES_PASS=${ES_PASS}
      - ES_INSECURE=${ES_INSECURE:-1}
      - RULES_DIR=/data/ollama-proxy/generated-rules
      - RULEGEN_INTERVAL=21600
      - RULEGEN_SINCE_HOURS=24
      - BLOCK_BANTIME_SECONDS=${BLOCK_BANTIME_SECONDS:-43200}
    volumes:
      - proxy_data:/data/ollama-proxy
      - ./run_rule_generator.py:/app/run_rule_generator.py:ro
      - rules_output:/data/ollama-proxy/generated-rules
    entrypoint: ["python", "/app/run_rule_generator.py"]

  heuristic-detector:
    container_name: ollama-heuristic-detector
    build: .
    restart: always
    network_mode: host
    environment:
      - CACHE_DB=/data/ollama-proxy/cache.db
      - ES_URL=${ES_URL}
      - ES_USER=${ES_USER}
      - ES_PASS=${ES_PASS}
      - ES_INSECURE=${ES_INSECURE:-1}
      - THREAT_DIR=/data/ollama-proxy/threat-intel
      - HEURISTIC_INTERVAL=1800
      - HEURISTIC_SINCE_HOURS=24
    volumes:
      - proxy_data:/data/ollama-proxy
      - ./run_heuristic_detector.py:/app/run_heuristic_detector.py:ro
      - threat_output:/data/ollama-proxy/threat-intel
    entrypoint: ["python", "/app/run_heuristic_detector.py"]

  footprint-orchestrator:
    container_name: ollama-footprint-orchestrator
    build: .
    restart: always
    network_mode: host
    environment:
      - CACHE_DB=/data/ollama-proxy/cache.db
      - THREAT_DIR=/data/ollama-proxy/threat-intel
      - SPIDERFOOT_URL=${SPIDERFOOT_URL:-http://127.0.0.1:5001/spiderfoot}
      - FOOTPRINT_INTERVAL=${FOOTPRINT_INTERVAL:-900}
      - FOOTPRINT_COOLDOWN_HOURS=${FOOTPRINT_COOLDOWN_HOURS:-24}
      - FOOTPRINT_MAX_NEW_SCANS=${FOOTPRINT_MAX_NEW_SCANS:-3}
      - FOOTPRINT_MAX_CONCURRENT=${FOOTPRINT_MAX_CONCURRENT:-2}
      - FOOTPRINT_MIN_SCORE=${FOOTPRINT_MIN_SCORE:-80}
      - FOOTPRINT_PASSIVE_USECASE=${FOOTPRINT_PASSIVE_USECASE:-Passive}
      - FOOTPRINT_ACTIVE_ENABLED=${FOOTPRINT_ACTIVE_ENABLED:-true}
      - FOOTPRINT_ACTIVE_USECASE=${FOOTPRINT_ACTIVE_USECASE:-Footprint}
      - FOOTPRINT_ACTIVE_MAX_NEW=${FOOTPRINT_ACTIVE_MAX_NEW:-1}
      - FOOTPRINT_ACTIVE_MAX_CONCURRENT=${FOOTPRINT_ACTIVE_MAX_CONCURRENT:-1}
      - FOOTPRINT_ACTIVE_COOLDOWN_HOURS=${FOOTPRINT_ACTIVE_COOLDOWN_HOURS:-168}
      - FOOTPRINT_ACTIVE_MIN_SCORE=${FOOTPRINT_ACTIVE_MIN_SCORE:-85}
      - FOOTPRINT_ACTIVE_REQUIRE_PASSIVE=${FOOTPRINT_ACTIVE_REQUIRE_PASSIVE:-true}
      - FOOTPRINT_ACTIVE_SCAN_TIMEOUT=${FOOTPRINT_ACTIVE_SCAN_TIMEOUT:-7200}
      - OSINT_FOOTPRINTS_DIR=/data/ollama-proxy/threat-intel/osint-footprints
    volumes:
      - proxy_data:/data/ollama-proxy
      - ./run_footprint_orchestrator.py:/app/run_footprint_orchestrator.py:ro
      - threat_output:/data/ollama-proxy/threat-intel
    entrypoint: ["python", "/app/run_footprint_orchestrator.py"]

  c2-detector:
    container_name: ollama-c2-detector
    build: .
    restart: always
    network_mode: host
    environment:
      - ES_URL=${ES_URL}
      - ES_USER=${ES_USER}
      - ES_PASS=${ES_PASS}
      - ES_INSECURE=${ES_INSECURE:-1}
      - C2_INTERVAL=300
      - C2_WINDOW=60
    volumes:
      - ./run_c2_detector.py:/app/run_c2_detector.py:ro
    entrypoint: ["python", "/app/run_c2_detector.py"]

  rule-validator:
    container_name: ollama-rule-validator
    build: .
    restart: always
    network_mode: host
    environment:
      - VALIDATOR_MODE=mirror
      - SOURCE_DIR=/data/ollama-proxy/generated-rules/latest
      - VALIDATED_DIR=/data/ollama-proxy/validated-rules
      - PROXY_URL=http://localhost:11435
      - VALIDATOR_INTERVAL=900
      - VALIDATOR_TIMEOUT=220
      - LLM_CONF_THRESHOLD=0.70
      - VALIDATOR_RETRY_MAX=4
      - VALIDATOR_RETRY_BACKOFF=3
      - VALIDATOR_MIN_SPACING=1.5
      - DEDUPE_THRESHOLD=0.93
      - DEDUPE_MIN_JACCARD=0.80
      - DEDUPE_DB_PATH=/data/ollama-proxy/rule_embeddings.sqlite
      - DEDUPE_EMBED_MODEL=nomic-embed-text
      - SKIP_LLM=false
    volumes:
      - proxy_data:/data/ollama-proxy
      - ./run_rule_validator.py:/app/run_rule_validator.py:ro
      - ./calibrate_thresholds.py:/app/calibrate_thresholds.py:ro
      - ./label_rules.py:/app/label_rules.py:ro
      - ./src/rule_validator:/app/src/rule_validator:ro
      - rules_output:/data/ollama-proxy/generated-rules:ro
      - rules_validated:/data/ollama-proxy/validated-rules
    entrypoint: ["python", "/app/run_rule_validator.py"]

  adversarial-simulator:
    container_name: ollama-adversarial-simulator
    build: .
    restart: unless-stopped
    network_mode: host
    depends_on:
      ollama-proxy:
        condition: service_healthy
    environment:
      # Feeds the reward aggregator + plausibility analyzer with labelled
      # multi-stage attacker sessions so the readiness gate doesn't starve
      # on sparse organic traffic. Synthetic IPs (10.99.0.0/16) and
      # X-Synthetic-Adversary header let analysts segregate in ES at will.
      - SIMULATOR_PROXY_URL=http://localhost:11435
      - SIMULATOR_LOOP=1
      - SIMULATOR_LOOP_INTERVAL=${SIMULATOR_LOOP_INTERVAL:-12h}
      - SIMULATOR_STARTUP_DELAY=${SIMULATOR_STARTUP_DELAY:-300s}
      - SIMULATOR_RUNS_PER_TICK=${SIMULATOR_RUNS_PER_TICK:-1}
      - SIMULATOR_TIMEOUT=${SIMULATOR_TIMEOUT:-60}
      - SIMULATOR_LOG_LEVEL=${SIMULATOR_LOG_LEVEL:-INFO}
    volumes:
      - ./run_adversarial_simulator.py:/app/run_adversarial_simulator.py:ro
    entrypoint: ["python", "/app/run_adversarial_simulator.py"]

volumes:
  proxy_data:
    name: ollama-proxy-data
  rules_output:
    name: ollama-rules-output
  threat_output:
    name: ollama-threat-output
  rules_validated:
    name: ollama-rules-validated
  ml_models:
    name: ollama-ml-models
  ml_datasets:
    name: ollama-ml-datasets
