# Ollama Proxy Stack - Caching proxy with RL for LLM honeypots
#
# Prerequisites:
#   - Ollama running on the host (port 11434)
#   - T-Pot VM with Elasticsearch accessible
#   - Copy .env.example to .env and fill in credentials
#
# Usage:
#   docker compose up -d

services:
  ollama-proxy:
    container_name: ollama-proxy
    build: .
    restart: always
    network_mode: host
    environment:
      - CONFIG_PATH=/app/config.yaml
      - CACHE_DB=/data/ollama-proxy/cache.db
      - ES_URL=${ES_URL}
    volumes:
      - proxy_data:/data/ollama-proxy
      - rules_output:/data/ollama-proxy/generated-rules:ro
      - threat_output:/data/ollama-proxy/threat-intel:ro
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:11435/proxy/health'); exit(0 if r.status_code==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  rl-scorer:
    container_name: ollama-rl-scorer
    build: .
    restart: always
    network_mode: host
    environment:
      - CACHE_DB=/data/ollama-proxy/cache.db
      - ES_URL=${ES_URL}
      - ES_USER=${ES_USER}
      - ES_PASS=${ES_PASS}
      - TPOT_VM_IP=${TPOT_VM_IP}
      - SCORER_INTERVAL=300
    volumes:
      - proxy_data:/data/ollama-proxy
      - ./run_scorer.py:/app/run_scorer.py:ro
    entrypoint: ["python", "/app/run_scorer.py"]

  reward-aggregator:
    container_name: ollama-reward-aggregator
    build: .
    restart: always
    network_mode: host
    environment:
      - CACHE_DB=/data/ollama-proxy/cache.db
      - ES_URL=${ES_URL}
      - ES_USER=${ES_USER}
      - ES_PASS=${ES_PASS}
      - REWARD_INTERVAL=900
      - REWARD_WINDOW_MINUTES=30
      - REWARD_BACKFILL_HOUR_UTC=2
      - VALIDATED_RULES_DIR=/data/ollama-proxy/validated-rules/approved
      - RULES_DIR=/data/ollama-proxy/generated-rules
      - REWARD_STATE_PATH=/data/ollama-proxy/reward_aggregator_state.json
    volumes:
      - proxy_data:/data/ollama-proxy
      - ./run_reward_aggregator.py:/app/run_reward_aggregator.py:ro
      - rules_output:/data/ollama-proxy/generated-rules:ro
      - rules_validated:/data/ollama-proxy/validated-rules:ro
    entrypoint: ["python", "/app/run_reward_aggregator.py"]

  ml-runner:
    container_name: ollama-ml-runner
    build: .
    restart: "no"
    network_mode: host
    environment:
      - ES_URL=${ES_URL}
      - ES_USER=${ES_USER}
      - ES_PASS=${ES_PASS}
      - DATASET_DIR=/data/ml-runner/datasets
      - MODEL_DIR=/data/ml-runner/models
      - ML_SOURCE_INDEX=honeypot-cve-sessions
      - ML_EXPORT_HOURS=720
      - ML_INFER_HOURS=24
      - ML_MAX_EXPORT_DOCS=50000
      - ML_MAX_INFER_DOCS=5000
    volumes:
      - ml_models:/data/ml-runner/models
      - ml_datasets:/data/ml-runner/datasets
      - ./run_ml_runner.py:/app/run_ml_runner.py:ro
    entrypoint: ["python", "/app/run_ml_runner.py"]

  rule-generator:
    container_name: ollama-rule-generator
    build: .
    restart: always
    network_mode: host
    environment:
      - CACHE_DB=/data/ollama-proxy/cache.db
      - ES_URL=${ES_URL}
      - ES_USER=${ES_USER}
      - ES_PASS=${ES_PASS}
      - RULES_DIR=/data/ollama-proxy/generated-rules
      - RULEGEN_INTERVAL=21600
      - RULEGEN_SINCE_HOURS=24
    volumes:
      - proxy_data:/data/ollama-proxy
      - ./run_rule_generator.py:/app/run_rule_generator.py:ro
      - rules_output:/data/ollama-proxy/generated-rules
    entrypoint: ["python", "/app/run_rule_generator.py"]

  heuristic-detector:
    container_name: ollama-heuristic-detector
    build: .
    restart: always
    network_mode: host
    environment:
      - CACHE_DB=/data/ollama-proxy/cache.db
      - ES_URL=${ES_URL}
      - ES_USER=${ES_USER}
      - ES_PASS=${ES_PASS}
      - THREAT_DIR=/data/ollama-proxy/threat-intel
      - HEURISTIC_INTERVAL=1800
      - HEURISTIC_SINCE_HOURS=24
    volumes:
      - proxy_data:/data/ollama-proxy
      - ./run_heuristic_detector.py:/app/run_heuristic_detector.py:ro
      - threat_output:/data/ollama-proxy/threat-intel
    entrypoint: ["python", "/app/run_heuristic_detector.py"]

  c2-detector:
    container_name: ollama-c2-detector
    build: .
    restart: always
    network_mode: host
    environment:
      - ES_URL=${ES_URL}
      - ES_USER=${ES_USER}
      - ES_PASS=${ES_PASS}
      - C2_INTERVAL=300
      - C2_WINDOW=60
    volumes:
      - ./run_c2_detector.py:/app/run_c2_detector.py:ro
    entrypoint: ["python", "/app/run_c2_detector.py"]

  rule-validator:
    container_name: ollama-rule-validator
    build: .
    restart: always
    network_mode: host
    environment:
      - VALIDATOR_MODE=mirror
      - SOURCE_DIR=/data/ollama-proxy/generated-rules/latest
      - VALIDATED_DIR=/data/ollama-proxy/validated-rules
      - PROXY_URL=http://localhost:11435
      - VALIDATOR_INTERVAL=900
      - VALIDATOR_TIMEOUT=220
      - LLM_CONF_THRESHOLD=0.70
      - VALIDATOR_RETRY_MAX=4
      - VALIDATOR_RETRY_BACKOFF=3
      - VALIDATOR_MIN_SPACING=1.5
      - DEDUPE_THRESHOLD=0.93
      - DEDUPE_MIN_JACCARD=0.80
      - DEDUPE_DB_PATH=/data/ollama-proxy/rule_embeddings.sqlite
      - DEDUPE_EMBED_MODEL=nomic-embed-text
      - SKIP_LLM=false
    volumes:
      - proxy_data:/data/ollama-proxy
      - ./run_rule_validator.py:/app/run_rule_validator.py:ro
      - ./calibrate_thresholds.py:/app/calibrate_thresholds.py:ro
      - ./src/rule_validator:/app/src/rule_validator:ro
      - rules_output:/data/ollama-proxy/generated-rules:ro
      - rules_validated:/data/ollama-proxy/validated-rules
    entrypoint: ["python", "/app/run_rule_validator.py"]

volumes:
  proxy_data:
    name: ollama-proxy-data
  rules_output:
    name: ollama-rules-output
  threat_output:
    name: ollama-threat-output
  rules_validated:
    name: ollama-rules-validated
  ml_models:
    name: ollama-ml-models
  ml_datasets:
    name: ollama-ml-datasets
