# Noise tagging overlay — mount as /etc/logstash/conf.d/99-noise-filter.conf
# Output routing is handled in the main logstash.conf (noise excluded from primary index).

filter {
  if [geoip][as_org] {
    if [geoip][as_org] =~ /(?i)(censys|shodan|shadowserver|binary edge|rapid7|stretchoid|internet measurement|netcraft)/ {
      mutate { add_tag => ["noise", "benign_scanner_asn"] }
    }
  }

  if [type] == "Galah" and [request][requestURI] {
    if [request][requestURI] =~ /(?i)^\/(\.env|robots\.txt|favicon\.ico|sitemap\.xml|\.git\/|wp-login\.php|wp-admin\/|phpmyadmin\/|manager\/html)$/ {
      mutate { add_tag => ["noise", "http_probe"] }
    }
  }

  translate {
    field => "[src_ip]"
    destination => "[noise_lookup]"
    dictionary_path => "/etc/logstash/noise_ips.csv"
    fallback => ""
  }
  if [noise_lookup] == "noise" {
    mutate { add_tag => ["noise", "ml_noise_ip"] }
  }
}
