# Dedicated, tool-equipped SpiderFoot on VM 200 (ai-workstation).
# ALL outbound scan traffic is forced through Tor (tor-gateway) so targets
# never see the home ISP IP. UI: http://192.168.2.116:5001/spiderfoot/
#
#   docker compose up -d --build
#
services:
  tor-gateway:
    build:
      context: ./tor-gateway
    image: spiderfoot-tor-gateway:local
    container_name: spiderfoot-tor-gateway
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "5001:5001"
    environment:
      - TZ=Europe/Berlin
      # Mandatory rotation (gateway exits if rotators die)
      - MAC_ROTATE_MIN_SEC=8
      - MAC_ROTATE_MAX_SEC=15
      - TOR_ROTATE_MIN_SEC=30
      - TOR_ROTATE_MAX_SEC=60

  spiderfoot:
    container_name: spiderfoot-toolbox
    build:
      context: .
      dockerfile: Dockerfile
    image: spiderfoot-toolbox:local
    restart: unless-stopped
    network_mode: "service:tor-gateway"
    depends_on:
      tor-gateway:
        condition: service_healthy
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - spiderfoot_data:/var/lib/spiderfoot
      - ./secrets:/run/spiderfoot-secrets:ro
    # Ports MUST be on tor-gateway when using network_mode: service:*

volumes:
  spiderfoot_data:
