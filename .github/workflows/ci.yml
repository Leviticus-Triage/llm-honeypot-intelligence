name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m pip install -r proxy/requirements.txt -r proxy/requirements-dev.txt

      - name: Ruff
        run: ruff check proxy/

      - name: Pytest
        run: pytest proxy/tests/ -v
