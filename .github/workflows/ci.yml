name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            proxy/requirements.txt
            proxy/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.15.11
          python -m pip install -r proxy/requirements.txt -r proxy/requirements-dev.txt

      - name: Ruff
        run: ruff check proxy/

      - name: Pytest
        run: pytest proxy/tests/ -v
